replicas: 1

image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1

kafka:
  bootstrapServers: kafka.mgmt.rezakara.demo:9094
  topic: pingkafka
  consumerGroup: pingkafka
  # Audience of the projected ServiceAccount token the broker validates.
  tokenAudience: kafka
  # Seconds between produced messages.
  intervalSeconds: 20

# Secret in the release namespace holding the broker CA under the key `ca.crt`.
rootCA:
  secretName: root-ca

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
